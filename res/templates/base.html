<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Ekwips Notes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='structured.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home.index') }}">ekwips</a>
    <nav><a class="active" href="{{ url_for('home.index') }}">Clients</a><a href="#">Users</a></nav>
    <div class="account">● My Account <span>Logout</span></div>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
